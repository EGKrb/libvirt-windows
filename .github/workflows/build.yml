name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # the release of a v* tag

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Dependencies
        run: windows/build.sh deps

      - name: Build and install
        run: windows/build.sh

      - name: virsh with the test driver
        run: |
          export PATH="$PWD/install/bin:$PATH"
          virsh --version
          virsh -c test:///default list --all
          virsh -c test:///default net-list --all

      - name: Daemons and the default network
        run: |
          export PATH="$PWD/install/bin:$PATH"
          install/sbin/virtnetworkd.exe --daemon
          install/sbin/virtqemud.exe --daemon
          sleep 5
          virsh -c qemu:///system net-list --all
          virsh -c qemu:///system net-info default
          virsh -c qemu:///system net-list | grep -q 'default.*act'
          virsh -c qemu:///system list --all
          tasklist | grep -i libvirt_netswitch
          cat install/var/log/libvirt/network/default.log

      - name: Stop the daemons
        if: always()
        shell: pwsh
        run: windows/stop-daemons.ps1 install

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Self-contained package
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            windows/package.sh "${{ steps.version.outputs.version }}" --sources
          else
            windows/package.sh "${{ steps.version.outputs.version }}"
          fi

      - name: The package without MSYS2
        shell: pwsh
        run: |
          $name = "libvirt-windows-${{ steps.version.outputs.version }}"
          # a short path, as the README says: D: of the runner makes no 8.3
          # names, and the workspace path leaves no room for the sockets
          Expand-Archive "dist\$name.zip" C:\lvw
          $r = "C:\lvw\$name"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & "$r\bin\virsh.exe" --version
          & "$r\bin\virsh.exe" -c test:///default list --all
          & "$r\sbin\virtnetworkd.exe" --daemon
          & "$r\sbin\virtqemud.exe" --daemon
          Start-Sleep 5
          & "$r\bin\virsh.exe" -c qemu:///system net-list --all
          $state = & "$r\bin\virsh.exe" -c qemu:///system net-list | Out-String
          windows\stop-daemons.ps1 $r
          if ($state -notmatch 'default\s+active') {
            Get-ChildItem "$r\var" -Recurse | Select-Object -Expand FullName
            Get-ChildItem "$r\var\log" -Recurse -Filter *.log | ForEach-Object { "== $_"; Get-Content $_.FullName -Tail 30 }
            & "$r\sbin\virtnetworkd.exe" --timeout 5 2>&1 | Select-Object -First 20
            throw "default network not active"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: libvirt-windows-${{ steps.version.outputs.version }}
          path: dist/libvirt-windows-${{ steps.version.outputs.version }}.zip
          retention-days: 14

      - name: Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Set-Location dist
          $files = Get-ChildItem "libvirt-windows-$v*.zip" | Select-Object -Expand Name
          # LF line ends: sha256sum -c reads them as they are
          $sums = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_ }
          [IO.File]::WriteAllText("$PWD\SHA256SUMS.txt", ($sums -join "`n") + "`n")
          gh release create "v$v" @files SHA256SUMS.txt `
            --title "libvirt for Windows $v (libvirt 12.9.0)" `
            --notes-file ..\windows\release-notes.md
